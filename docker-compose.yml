# docker-compose.yml — French-Learning-Perceptions ML (Level 2 MLOps)
# Orchestration locale : API FastAPI + MLflow Tracking Server

services:
  # ── API FastAPI ─────────────────────────────────────────────────────────
  api:
    build: .
    container_name: flp-api
    ports:
      - "${API_PORT:-8001}:${API_PORT:-8001}"
    volumes:
      - ./models:/app/models:ro
      - ./params.yaml:/app/params.yaml:ro
      - ./mlflow.db:/app/mlflow.db
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=${API_PORT:-8001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── MLflow Tracking Server ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.0
    container_name: flp-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlruns:/mlflow/mlruns
      - ./models:/mlflow/models
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped
