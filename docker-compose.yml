# docker-compose.yml — French-Learning-Perceptions ML (Level 2 MLOps)
# Orchestration locale : API FastAPI + MLflow Tracking Server

services:
  # ── API FastAPI ─────────────────────────────────────────────────────────
  api:
    build: .
    container_name: flp-api
    ports:
      - "${API_PORT:-8001}:${API_PORT:-8001}"
    volumes:
      - ./models:/app/models:ro
      - ./params.yaml:/app/params.yaml:ro
      - ./mlflow.db:/app/mlflow.db
      - ./monitoring:/app/monitoring
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=${API_PORT:-8001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── MLflow Tracking Server ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.0
    container_name: flp-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_docker.db:/mlflow/mlflow.db
      - ./mlruns:/mlflow/mlruns
      - ./models:/mlflow/models
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

  # ── Prometheus (MLOps Level 3) ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: flp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/:/etc/prometheus/:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  # ── Grafana (MLOps Level 3) ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: flp-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/datasources/:/etc/grafana/provisioning/datasources/:ro
      - ./monitoring/grafana/dashboards/:/etc/grafana/provisioning/dashboards/:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/flp_dashboard.json
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
