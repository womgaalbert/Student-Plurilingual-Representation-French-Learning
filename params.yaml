# params.yaml — French-Learning-Perceptions-in-Plurilingual-Cameroon
# All hyperparameters externalized (Level 1 MLOps)
# Edit here — never hardcode values in source files.

data:
  raw_path:       "data/raw/data_FLP.csv"
  processed_dir:  "data/processed"
  consent_value:  "accepte"
  test_size:      0.15
  val_size:       0.15
  random_state:   42

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  registry_uri: "sqlite:///mlflow.db"
  experiments:
    h1: "FLP_H1_Multilingual_Repertoire"
    h2: "FLP_H2_French_Representations"
    h3: "FLP_H3_Plurilingual_Exposure"
    h4: "FLP_H4_Local_Language_Integration"
  models:
    h1: "FLP_H1_usage_quotidien"
    h2: "FLP_H2_motivation_difficultes"
    h3: "FLP_H3_attitude"
    h4: "FLP_H4_engagement"

api:
  port: 9000

h1:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  cv_folds: 5
  smote: true
  thresholds:
    f1_macro: 0.70
    roc_auc:  0.75

h2:
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.08
  cv_folds: 5
  thresholds:
    f1_weighted_A: 0.65
    f1_micro_B:    0.72
  tuning:
    cv_folds: 3
    smote: true
    n_estimators: [100, 200, 300]
    max_depth:    [3, 4, 5]
    learning_rate: [0.05, 0.08, 0.10]

descriptive:
  camembert_model:         "camembert-base"
  camembert_n_components:  20
  camembert_device:        "cpu"
  batch_size:              16
  max_length:              128
  n_clusters:              5
  umap_n_neighbors:        15
  umap_min_dist:           0.10
  umap_random_state:       42
  ngram_top_k:             20
  ngram_min_df:            2
  cosine_threshold:        0.30

h3:
  n_estimators_reg: 400
  n_estimators_clf: 200
  max_depth_reg: 8
  min_samples_leaf: 2
  max_depth: 6
  cv_folds: 5
  causal: true
  thresholds:
    mae:         0.50
    f1_weighted: 0.68
    pearson_p:   0.05
  tuning:
    cv_folds: 3
    n_estimators_reg:    [200, 400, 600, 800]
    max_depth_reg:       [6, 8, 10, 12]
    min_samples_leaf:    [1, 2, 4]
    n_estimators_clf:    [100, 200, 300]
    max_depth_clf:       [3, 4, 6]

h4:
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.08
  cv_folds: 5
  thresholds:
    f1_A:       0.70
    spearman_B: 0.55
    subset_C:   0.45
  tuning:
    cv_folds: 3
    smote: true
    n_estimators:      [100, 200, 300]
    max_depth:         [3, 4, 5]
    learning_rate:     [0.05, 0.08, 0.10, 0.15]
    scale_pos_weight:  [1, 2, 5, 10]

# ── MLOps Level 3 — Monitoring & Auto-retraining ──────────────────────────
monitoring:
  prediction_db:      "monitoring/predictions.db"

  drift:
    enabled:           true
    window_size:       200              # nombre de prédictions par fenêtre de drift
    drift_threshold:   0.3              # ratio de features en drift → alerte (0.0-1.0)
    check_interval_h:  24               # intervalle entre checks automatiques (heures)
    reference_data_path: "data/processed/"
    report_dir:         "monitoring/reports/"

  alert:
    alerts_dir:        "monitoring/alerts/"
    min_severity:      "WARNING"        # INFO | WARNING | CRITICAL
    github_dispatch:   false            # déclencher retrain via GitHub API

  prometheus:
    enabled:           true
    port:              8001             # réutilise le port API pour /metrics
