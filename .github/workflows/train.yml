# .github/workflows/train.yml — Level 2 MLOps
# Entraînement automatique sur push vers main/dev
# + déploiement conditionnel si les seuils sont atteints

name: Train & Evaluate Pipeline

"on":
  push:
    branches: [main]
    paths:
      - "src/**"
      - "params.yaml"
      - ".github/workflows/train.yml"
  schedule:
    - cron: "0 7 * * 1"  # chaque lundi à 7h UTC
  workflow_dispatch:      # déclenchement manuel

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Validate pipeline imports (CI — sans données)
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          # Test que tous les imports critiques fonctionnent (lazy deps OK)
          from preprocess import run as run_preprocess
          from descriptive_analysis import run_full as run_descriptive
          from train import train_h1, train_h2, train_h3, train_h4
          from evaluate import run as run_evaluate
          print('✅ Tous les imports pipeline OK (lazy deps validés)')
          "

      - name: Preprocess + Train (données requises)
        run: python src/pipeline.py --config params.yaml
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Register models (staging)
        if: false  # désactivé en CI — nécessite les artefacts d'entraînement
        run: python scripts/register_models.py

      - name: Validate thresholds
        if: false  # désactivé en CI — nécessite le rapport d'évaluation
        id: validate
        run: echo "Skipped — requires training artifacts"

      - name: Promote to production
        if: false  # désactivé en CI — nécessite le Model Registry
        run: echo "Skipped — requires training artifacts"
