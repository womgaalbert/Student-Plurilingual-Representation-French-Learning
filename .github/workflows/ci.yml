# .github/workflows/ci.yml
# Runs automatically on every push and pull request to main / dev
# Tests the full preprocessing + unit test suite

name: CI — Test Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Verify params.yaml is valid
        run: |
          python -c "
          import yaml
          with open('params.yaml') as f:
              cfg = yaml.safe_load(f)
          assert 'data' in cfg
          assert 'mlflow' in cfg
          for h in ['h1','h2','h3','h4']:
              assert h in cfg, f'Missing section {h}'
              assert 'thresholds' in cfg[h]
          print('params.yaml OK')
          "
